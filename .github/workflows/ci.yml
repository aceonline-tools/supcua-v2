name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go build ./...

  vet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go vet ./...

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -count=1 ./...
      - name: Flake guard (late-payload writer file count, 500 runs)
        run: go test -count=500 -run TestE1bSealFloodOfLateSavesUsesOneCoalescingWriter ./bridge

  race-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -race -count=1 ./executor/ ./app/ .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build

  build-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - run: shellcheck release.sh scripts/*.sh
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.0"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install rsrc (job-local GOBIN)
        run: |
          GOBIN="$RUNNER_TEMP/tools" go install github.com/akavel/rsrc@v0.10.2
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: release.sh makes no publish call
        run: scripts/test-release-build-only.sh --plain

  release-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - id: build
        uses: ./.github/actions/release-build
        with:
          version: 0.0.0-ci.${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: supcua-v2-${{ github.sha }}
          path: |
            supcua-v2.exe
            supcua-v2.exe.sha256
          if-no-files-found: error

  app-selftest:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.0"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install garble and rsrc (job-local GOBIN)
        run: |
          set -euo pipefail
          export GOBIN="$RUNNER_TEMP/selftest-tools"
          go install mvdan.cc/garble@v0.15.0
          go install github.com/akavel/rsrc@v0.10.2
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Build plain and garble exes
        run: |
          set -euo pipefail
          scripts/build.sh --plain --version 0.0.0-selftest --out out/plain
          scripts/build.sh --version 0.0.0-selftest --out out/garble
      - name: Self-tests (plain + garble, both modes)
        shell: pwsh
        run: |
          $fail = 0
          $results = Join-Path $PWD "out/results"
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          foreach ($v in "plain","garble") {
            foreach ($mode in "-selftest","-selftest-noruntime") {
              $name = $mode.TrimStart('-')
              $exe = Join-Path $PWD "out/$v/supcua-v2.exe"
              $o = "out/$v/stdout$mode.txt"; $e = "out/$v/stderr$mode.txt"
              $env:SUPCUA_OVERLAY_SHOTS = Join-Path $PWD "out/overlay-shots/$v-$name"
              $env:SUPCUA_EDITOR_SHOTS = Join-Path $PWD "out/editor-window-shots/$v-$name"
              $p = Start-Process -FilePath $exe -ArgumentList $mode -PassThru `
                   -RedirectStandardOutput $o -RedirectStandardError $e
              if (-not $p.WaitForExit(240000)) {
                $p.Kill($true)
                Write-Host "$v $mode TIMEOUT after 240s"
                $fail = 1
                continue
              }
              Write-Host "$v $mode exit=$($p.ExitCode)"
              Get-Content $o, $e -ErrorAction SilentlyContinue
              if ($p.ExitCode -ne 0) { $fail = 1 }
              Copy-Item $o (Join-Path $results "$v-$name.stdout.txt") -ErrorAction SilentlyContinue
              Copy-Item $e (Join-Path $results "$v-$name.stderr.txt") -ErrorAction SilentlyContinue
              $j = "out/$v/supcua-v2.exe.$name.json"
              if (Test-Path -LiteralPath $j) {
                Copy-Item -LiteralPath $j (Join-Path $results "$v-$name.json") -Force
              } else {
                Write-Host "::error::missing selftest result $j for $v $mode (exit=$($p.ExitCode))"
                $fail = 1
              }
            }
          }
          exit $fail
      - name: Production-sequence self-test (plain + garble, fixture data, hotkeys via SendInput)
        shell: pwsh
        run: |
          $fail = 0
          $results = Join-Path $PWD "out/results"
          $fixture = Join-Path $PWD "testdata/prod-fixture"
          $required = @("config loaded", "bridge ready", "webview created and shown", "tray done",
            "hotkey listener started", "fixed hotkeys registered (2,", "script hotkeys set", "auto-active started",
            "entering Run", "first navigation completed success=true", "app.ready received", "frontend mounted", "hotkey fired")
          foreach ($v in "plain","garble") {
            $dir = Join-Path $PWD "out/$v"
            $log = Join-Path $dir "supcua-v2.log"
            Remove-Item -LiteralPath $log -ErrorAction SilentlyContinue
            $o = "$dir/stdout-prod.txt"; $e = "$dir/stderr-prod.txt"
            $env:SUPCUA_EDITOR_SHOTS = Join-Path $PWD "out/editor-window-shots/$v-production"
            $p = Start-Process -FilePath (Join-Path $dir "supcua-v2.exe") -ArgumentList "-selftest-production","-fixture",$fixture,"-label",$v `
                 -PassThru -RedirectStandardOutput $o -RedirectStandardError $e
            if (-not $p.WaitForExit(240000)) { $p.Kill($true); Write-Host "::error::$v selftest-production TIMEOUT"; $fail = 1 }
            else { Write-Host "$v selftest-production exit=$($p.ExitCode)"; if ($p.ExitCode -ne 0) { $fail = 1 } }
            Get-Content $o, $e -ErrorAction SilentlyContinue
            Copy-Item $o (Join-Path $results "$v-prod.stdout.txt") -ErrorAction SilentlyContinue
            $j = "$dir/supcua-v2.exe.selftest-production.json"
            if (Test-Path -LiteralPath $j) { Copy-Item -LiteralPath $j (Join-Path $results "$v-prod.json") -Force }
            else { Write-Host "::error::missing $j"; $fail = 1 }
            if (Test-Path -LiteralPath $log) {
              Copy-Item -LiteralPath $log (Join-Path $results "$v-prod.log") -Force
              $text = Get-Content -LiteralPath $log -Raw
              foreach ($line in $required) {
                if (-not $text.Contains($line)) { Write-Host "::error::$v log lacks stage line '$line'"; $fail = 1 }
              }
            } else { Write-Host "::error::$v wrote no supcua-v2.log"; $fail = 1 }
          }
          exit $fail
      - name: Production start without flags (garble; unlicensed runner must render the licence screen)
        shell: pwsh
        run: |
          $dir = Join-Path $PWD "out/garble"
          $log = Join-Path $dir "supcua-v2.log"
          Remove-Item -LiteralPath $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath (Join-Path $dir "supcua-v2.exe") -PassThru
          $text = ""
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $deadline -and -not $p.HasExited) {
            Start-Sleep -Seconds 1
            if (Test-Path -LiteralPath $log) {
              $fs = [IO.File]::Open($log, 'Open', 'Read', 'ReadWrite')
              try { $text = (New-Object IO.StreamReader($fs)).ReadToEnd() } finally { $fs.Dispose() }
              if ($text.Contains("frontend mounted")) { break }
            }
          }
          Add-Type -AssemblyName System.Drawing
          $sig = '[StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; } [StructLayout(LayoutKind.Sequential)] public struct PT { public int X, Y; } [DllImport("user32.dll")] public static extern bool GetClientRect(IntPtr h, out RECT r); [DllImport("user32.dll")] public static extern bool ClientToScreen(IntPtr h, ref PT p);'
          Add-Type -Namespace W -Name U -MemberDefinition $sig
          $paint = "not sampled"; $distinct = 0
          Add-Type -MemberDefinition '[DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h); [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr h, IntPtr a, int x, int y, int cx, int cy, uint f);' -Namespace W -Name F
          $deadline2 = (Get-Date).AddSeconds(20)
          while (-not $p.HasExited) {
            $p.Refresh(); $h = $p.MainWindowHandle
            if ($h -ne [IntPtr]::Zero) {
              [void][W.F]::SetWindowPos($h, [IntPtr]::new(-1), 0, 0, 0, 0, 0x53)
              [void][W.F]::SetForegroundWindow($h)
              $r = New-Object W.U+RECT; [void][W.U]::GetClientRect($h, [ref]$r)
              $pt = New-Object W.U+PT; [void][W.U]::ClientToScreen($h, [ref]$pt)
              $w = $r.R - $r.L; $ht = $r.B - $r.T
              if ($w -gt 0 -and $ht -gt 0) {
                $bmp = New-Object System.Drawing.Bitmap $w, $ht
                $g = [System.Drawing.Graphics]::FromImage($bmp)
                $g.CopyFromScreen($pt.X, $pt.Y, 0, 0, $bmp.Size)
                $seen = @{}
                for ($y = 0; $y -lt $ht; $y += 5) { for ($x = 0; $x -lt $w; $x += 5) { $seen[$bmp.GetPixel($x, $y).ToArgb()] = 1 } }
                $distinct = $seen.Count; $paint = "client=${w}x${ht} distinct=$distinct"
                if ($distinct -ge 4) { break }
              }
            } else { $paint = "no main window handle" }
            if ((Get-Date) -gt $deadline2) { break }
            Start-Sleep -Milliseconds 500
          }
          if ($distinct -lt 4 -and $bmp) { New-Item -ItemType Directory -Force -Path out/blank | Out-Null; $bmp.Save((Join-Path $PWD "out/blank/noflags-window.png")) }
          Write-Host "window pixels (default dark theme): $paint"
          $exited = $p.HasExited
          if (-not $exited) { $p.Kill($true) }
          New-Item -ItemType Directory -Force -Path out/results | Out-Null
          Set-Content -LiteralPath out/results/garble-noflags.log -Value ($text + "`n" + $paint)
          Write-Host $text
          $fail = 0
          if ($exited) { Write-Host "::error::app exited early (code $($p.ExitCode))"; $fail = 1 }
          foreach ($line in "not licensed", "frontend mounted") {
            if (-not $text.Contains($line)) { Write-Host "::error::no-flags log lacks '$line'"; $fail = 1 }
          }
          if ($distinct -lt 4) { Write-Host "::error::no-flags window client area is blank (white surface): $paint"; $fail = 1 }
          exit $fail
      - name: Startup loader evidence (production start, garble; themed loader frames, then hand-off)
        shell: pwsh
        run: |
          $dir = Join-Path $PWD "out/garble"
          $log = Join-Path $dir "supcua-v2.log"
          $shots = Join-Path $PWD "out/loader-shots"
          New-Item -ItemType Directory -Force -Path $shots | Out-Null
          Remove-Item -LiteralPath $log -ErrorAction SilentlyContinue
          Add-Type -AssemblyName System.Drawing
          Add-Type -Namespace W -Name L -MemberDefinition '[StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; } [StructLayout(LayoutKind.Sequential)] public struct PT { public int X, Y; } [DllImport("user32.dll")] public static extern bool GetClientRect(IntPtr h, out RECT r); [DllImport("user32.dll")] public static extern bool ClientToScreen(IntPtr h, ref PT p); [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h); [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr h, IntPtr a, int x, int y, int cx, int cy, uint f);'
          Add-Type -Namespace W -Name P -UsingNamespace System.Collections.Generic -MemberDefinition 'public static int[] Stat(byte[] b, int stride, int w, int h) { var d = new Dictionary<int,int>(); int best = 0, bk = 0; for (int y = 0; y < h; y++) { int r = y * stride; for (int x = 0; x < w; x++) { int i = r + x * 4; int k = (b[i+2] << 16) | (b[i+1] << 8) | b[i]; int c; d.TryGetValue(k, out c); c++; d[k] = c; if (c > best) { best = c; bk = k; } } } return new int[] { d.Count, bk, best, w * h }; }'
          function Near([int]$c, [int]$t) {
            foreach ($sh in 16, 8, 0) { if ([math]::Abs((($c -shr $sh) -band 255) - (($t -shr $sh) -band 255)) -gt 8) { return $false } }
            return $true
          }
          $dark = 0x101318; $light = 0xF3F6FB
          $p = Start-Process -FilePath (Join-Path $dir "supcua-v2.exe") -PassThru
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $rows = @(); $n = 0; $tShown = $null; $tDone = $null; $topped = $false; $final = $false
          while ($sw.ElapsedMilliseconds -lt 45000 -and -not $p.HasExited) {
            $text = ""
            if (Test-Path -LiteralPath $log) {
              try { $fs = [IO.File]::Open($log, 'Open', 'Read', 'ReadWrite'); try { $text = (New-Object IO.StreamReader($fs)).ReadToEnd() } finally { $fs.Dispose() } } catch {}
            }
            $shown = $text.Contains("webview created and shown")
            $done = $text.Contains("loader done") -or $text.Contains("loader error")
            if ($shown -and $null -eq $tShown) { $tShown = $sw.ElapsedMilliseconds }
            if ($done -and $null -eq $tDone) { $tDone = $sw.ElapsedMilliseconds }
            if ($null -ne $tDone -and ($sw.ElapsedMilliseconds - $tDone) -ge 700) { $final = $true }
            $p.Refresh(); $h = $p.MainWindowHandle
            if ($shown -and $h -ne [IntPtr]::Zero -and $n -lt 80) {
              if (-not $topped) { [void][W.L]::SetWindowPos($h, [IntPtr]::new(-1), 0, 0, 0, 0, 0x53); [void][W.L]::SetForegroundWindow($h); $topped = $true }
              $r = New-Object W.L+RECT; [void][W.L]::GetClientRect($h, [ref]$r)
              $pt = New-Object W.L+PT; [void][W.L]::ClientToScreen($h, [ref]$pt)
              $w = $r.R - $r.L; $ht = $r.B - $r.T
              if ($w -gt 0 -and $ht -gt 0) {
                $at = $sw.ElapsedMilliseconds - $tShown
                $bmp = New-Object System.Drawing.Bitmap $w, $ht
                $g = [System.Drawing.Graphics]::FromImage($bmp)
                $g.CopyFromScreen($pt.X, $pt.Y, 0, 0, $bmp.Size)
                $d = $bmp.LockBits((New-Object System.Drawing.Rectangle 0, 0, $w, $ht), [System.Drawing.Imaging.ImageLockMode]::ReadOnly, [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
                $bytes = New-Object byte[] ($d.Stride * $ht)
                [System.Runtime.InteropServices.Marshal]::Copy($d.Scan0, $bytes, 0, $bytes.Length)
                $stride = $d.Stride; $bmp.UnlockBits($d)
                $st = [W.P]::Stat($bytes, $stride, $w, $ht)
                $phase = if ($final) { "after" } elseif ($null -ne $tDone) { "handoff" } else { "loading" }
                $name = "{0:D2}-{1}-{2}ms.png" -f $n, $phase, $at
                $bmp.Save((Join-Path $shots $name)); $g.Dispose(); $bmp.Dispose()
                $rows += [pscustomobject]@{ N = $n; Phase = $phase; At = $at; Distinct = $st[0]; Dom = $st[1]; Share = [math]::Round($st[2] / $st[3], 3); File = $name }
                $n++
              }
            }
            if ($final -and ($rows | Where-Object { $_.Phase -eq "after" })) { break }
            Start-Sleep -Milliseconds 40
          }
          $exited = $p.HasExited
          if (-not $exited) { $p.Kill($true) }
          $lines = $rows | ForEach-Object { "{0} {1,-8} +{2,5}ms distinct={3,5} dominant=#{4:X6} share={5} {6}" -f $_.N, $_.Phase, $_.At, $_.Distinct, $_.Dom, $_.Share, $_.File }
          $lines | Set-Content -LiteralPath (Join-Path $shots "summary.txt")
          Write-Host ("tShown={0}ms tDone={1}ms frames={2}" -f $tShown, $tDone, $rows.Count)
          $lines | ForEach-Object { Write-Host $_ }
          if (Test-Path -LiteralPath $log) { Copy-Item -LiteralPath $log (Join-Path $shots "supcua-v2.log") -Force }
          $fail = 0
          if ($null -eq $tShown) { Write-Host "::error::never saw 'webview created and shown'"; exit 1 }
          if ($null -eq $tDone) { Write-Host "::error::loader never handed off (no 'loader done' log line)"; $fail = 1 }
          $loading = @($rows | Where-Object { $_.Phase -eq "loading" })
          if ($loading.Count -lt 1) { Write-Host "::error::no frame captured while the loader was up"; $fail = 1 }
          foreach ($f in $loading) {
            if (-not ((Near $f.Dom $dark) -or (Near $f.Dom $light)) -or $f.Share -lt 0.7) { Write-Host ("::error::loading frame {0} (+{1}ms) is not the themed background: dominant=#{2:X6} share={3}" -f $f.File, $f.At, $f.Dom, $f.Share); $fail = 1 }
          }
          if ($text.Contains("loader error")) { Write-Host "::error::loader ended in its error state on a normal start"; $fail = 1 }
          $painted = $loading | Where-Object { $_.Distinct -ge 4 } | Select-Object -First 1
          if ($null -eq $painted) { Write-Host "::warning::no captured frame showed the loader's own pixels (page first paint was between two captures)" }
          else { Write-Host ("loader painted at +{0}ms: dominant=#{1:X6} distinct={2}" -f $painted.At, $painted.Dom, $painted.Distinct) }
          $first = $loading | Select-Object -First 1
          if ($null -ne $first -and $first.Distinct -ge 4) { Write-Host ("first frame already painted (fast start) +{0}ms: dominant=#{1:X6} share={2} distinct={3}" -f $first.At, $first.Dom, $first.Share, $first.Distinct) }
          elseif ($null -ne $first) { Write-Host ("first frame +{0}ms (before the page painted): dominant=#{1:X6} share={2} distinct={3}" -f $first.At, $first.Dom, $first.Share, $first.Distinct) }
          $after = $rows | Where-Object { $_.Phase -eq "after" } | Select-Object -First 1
          if ($null -eq $after) { Write-Host "::error::no frame after the hand-off"; $fail = 1 }
          elseif ($after.Distinct -lt 4) { Write-Host ("::error::window blank after hand-off: distinct={0}" -f $after.Distinct); $fail = 1 }
          else {
            $hAfter = (Get-FileHash (Join-Path $shots $after.File)).Hash
            $hFirst = if ($null -ne $first) { (Get-FileHash (Join-Path $shots $first.File)).Hash } else { "" }
            if ($hAfter -eq $hFirst -and $first.Distinct -lt 4) { Write-Host "::error::after-hand-off frame is identical to the first (blank) loading frame"; $fail = 1 }
            else { Write-Host ("after hand-off frame OK (+{0}ms): distinct={1} dominant=#{2:X6}" -f $after.At, $after.Distinct, $after.Dom) }
          }
          if ($exited) { Write-Host "::error::app exited early (code $($p.ExitCode))"; $fail = 1 }
          exit $fail
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: loader-shots
          path: out/loader-shots/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: app-selftest-results
          path: out/results/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: overlay-shots
          path: out/overlay-shots/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: editor-window-shots
          path: out/editor-window-shots/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: app-selftest-blank-window
          path: out/blank/
          if-no-files-found: ignore
          retention-days: 7
