name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go build ./...

  vet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go vet ./...

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -count=1 ./...

  race-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -race -count=1 ./executor/ ./app/ .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build

  build-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - run: shellcheck release.sh scripts/*.sh
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.0"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install rsrc (job-local GOBIN)
        run: |
          GOBIN="$RUNNER_TEMP/tools" go install github.com/akavel/rsrc@v0.10.2
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: release.sh makes no publish call
        run: scripts/test-release-build-only.sh --plain

  release-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - id: build
        uses: ./.github/actions/release-build
        with:
          version: 0.0.0-ci.${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: supcua-v2-${{ github.sha }}
          path: |
            supcua-v2.exe
            supcua-v2.exe.sha256
          if-no-files-found: error

  app-selftest:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.0"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install garble and rsrc (job-local GOBIN)
        run: |
          set -euo pipefail
          export GOBIN="$RUNNER_TEMP/selftest-tools"
          go install mvdan.cc/garble@v0.15.0
          go install github.com/akavel/rsrc@v0.10.2
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Build plain and garble exes
        run: |
          set -euo pipefail
          scripts/build.sh --plain --version 0.0.0-selftest --out out/plain
          scripts/build.sh --version 0.0.0-selftest --out out/garble
      - name: Self-tests (plain + garble, both modes)
        shell: pwsh
        run: |
          $fail = 0
          $results = Join-Path $PWD "out/results"
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          foreach ($v in "plain","garble") {
            foreach ($mode in "-selftest","-selftest-noruntime") {
              $name = $mode.TrimStart('-')
              $exe = Join-Path $PWD "out/$v/supcua-v2.exe"
              $o = "out/$v/stdout$mode.txt"; $e = "out/$v/stderr$mode.txt"
              $p = Start-Process -FilePath $exe -ArgumentList $mode -PassThru `
                   -RedirectStandardOutput $o -RedirectStandardError $e
              if (-not $p.WaitForExit(120000)) {
                $p.Kill($true)
                Write-Host "$v $mode TIMEOUT after 120s"
                $fail = 1
                continue
              }
              Write-Host "$v $mode exit=$($p.ExitCode)"
              Get-Content $o, $e -ErrorAction SilentlyContinue
              if ($p.ExitCode -ne 0) { $fail = 1 }
              Copy-Item $o (Join-Path $results "$v-$name.stdout.txt") -ErrorAction SilentlyContinue
              Copy-Item $e (Join-Path $results "$v-$name.stderr.txt") -ErrorAction SilentlyContinue
              $j = "out/$v/supcua-v2.exe.$name.json"
              if (Test-Path -LiteralPath $j) {
                Copy-Item -LiteralPath $j (Join-Path $results "$v-$name.json") -Force
              } else {
                Write-Host "::error::missing selftest result $j for $v $mode (exit=$($p.ExitCode))"
                $fail = 1
              }
            }
          }
          exit $fail
      - name: Production-sequence self-test (plain + garble, fixture data, hotkeys via SendInput)
        shell: pwsh
        run: |
          $fail = 0
          $results = Join-Path $PWD "out/results"
          $fixture = Join-Path $PWD "testdata/prod-fixture"
          $required = @("config loaded", "bridge ready", "webview created and shown", "tray done",
            "hotkey listener started", "fixed hotkeys registered (2,", "script hotkeys set", "auto-active started",
            "entering Run", "first navigation completed success=true", "app.ready received", "frontend mounted", "hotkey fired")
          foreach ($v in "plain","garble") {
            $dir = Join-Path $PWD "out/$v"
            $log = Join-Path $dir "supcua-v2.log"
            Remove-Item -LiteralPath $log -ErrorAction SilentlyContinue
            $o = "$dir/stdout-prod.txt"; $e = "$dir/stderr-prod.txt"
            $p = Start-Process -FilePath (Join-Path $dir "supcua-v2.exe") -ArgumentList "-selftest-production","-fixture",$fixture,"-label",$v `
                 -PassThru -RedirectStandardOutput $o -RedirectStandardError $e
            if (-not $p.WaitForExit(120000)) { $p.Kill($true); Write-Host "::error::$v selftest-production TIMEOUT"; $fail = 1 }
            else { Write-Host "$v selftest-production exit=$($p.ExitCode)"; if ($p.ExitCode -ne 0) { $fail = 1 } }
            Get-Content $o, $e -ErrorAction SilentlyContinue
            Copy-Item $o (Join-Path $results "$v-prod.stdout.txt") -ErrorAction SilentlyContinue
            $j = "$dir/supcua-v2.exe.selftest-production.json"
            if (Test-Path -LiteralPath $j) { Copy-Item -LiteralPath $j (Join-Path $results "$v-prod.json") -Force }
            else { Write-Host "::error::missing $j"; $fail = 1 }
            if (Test-Path -LiteralPath $log) {
              Copy-Item -LiteralPath $log (Join-Path $results "$v-prod.log") -Force
              $text = Get-Content -LiteralPath $log -Raw
              foreach ($line in $required) {
                if (-not $text.Contains($line)) { Write-Host "::error::$v log lacks stage line '$line'"; $fail = 1 }
              }
            } else { Write-Host "::error::$v wrote no supcua-v2.log"; $fail = 1 }
          }
          exit $fail
      - name: Production start without flags (garble; unlicensed runner must render the licence screen)
        shell: pwsh
        run: |
          $dir = Join-Path $PWD "out/garble"
          $log = Join-Path $dir "supcua-v2.log"
          Remove-Item -LiteralPath $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath (Join-Path $dir "supcua-v2.exe") -PassThru
          $text = ""
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $deadline -and -not $p.HasExited) {
            Start-Sleep -Seconds 1
            if (Test-Path -LiteralPath $log) {
              $fs = [IO.File]::Open($log, 'Open', 'Read', 'ReadWrite')
              try { $text = (New-Object IO.StreamReader($fs)).ReadToEnd() } finally { $fs.Dispose() }
              if ($text.Contains("frontend mounted")) { break }
            }
          }
          Add-Type -AssemblyName System.Drawing
          $sig = '[StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; } [StructLayout(LayoutKind.Sequential)] public struct PT { public int X, Y; } [DllImport("user32.dll")] public static extern bool GetClientRect(IntPtr h, out RECT r); [DllImport("user32.dll")] public static extern bool ClientToScreen(IntPtr h, ref PT p);'
          Add-Type -Namespace W -Name U -MemberDefinition $sig
          $paint = "not sampled"; $distinct = 0
          if (-not $p.HasExited) {
            Start-Sleep -Seconds 3
            $p.Refresh(); $h = $p.MainWindowHandle
            if ($h -ne [IntPtr]::Zero) {
              $r = New-Object W.U+RECT; [void][W.U]::GetClientRect($h, [ref]$r)
              $pt = New-Object W.U+PT; [void][W.U]::ClientToScreen($h, [ref]$pt)
              $w = $r.R - $r.L; $ht = $r.B - $r.T
              $bmp = New-Object System.Drawing.Bitmap $w, $ht
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($pt.X, $pt.Y, 0, 0, $bmp.Size)
              $seen = @{}
              for ($y = 0; $y -lt $ht; $y += 5) { for ($x = 0; $x -lt $w; $x += 5) { $seen[$bmp.GetPixel($x, $y).ToArgb()] = 1 } }
              $distinct = $seen.Count; $paint = "client=${w}x${ht} distinct=$distinct"
            } else { $paint = "no main window handle" }
          }
          Write-Host "window pixels (default dark theme): $paint"
          $exited = $p.HasExited
          if (-not $exited) { $p.Kill($true) }
          New-Item -ItemType Directory -Force -Path out/results | Out-Null
          Set-Content -LiteralPath out/results/garble-noflags.log -Value ($text + "`n" + $paint)
          Write-Host $text
          $fail = 0
          if ($exited) { Write-Host "::error::app exited early (code $($p.ExitCode))"; $fail = 1 }
          foreach ($line in "not licensed", "frontend mounted") {
            if (-not $text.Contains($line)) { Write-Host "::error::no-flags log lacks '$line'"; $fail = 1 }
          }
          if ($distinct -lt 4) { Write-Host "::error::no-flags window client area is blank (white surface): $paint"; $fail = 1 }
          exit $fail
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: app-selftest-results
          path: out/results/
          if-no-files-found: error
          retention-days: 7
