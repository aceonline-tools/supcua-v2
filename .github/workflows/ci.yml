name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go build ./...

  vet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go vet ./...

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -count=1 ./...

  race-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -race -count=1 ./executor/ ./app/ .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build

  build-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - run: shellcheck release.sh scripts/*.sh
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.0"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install rsrc (job-local GOBIN)
        run: |
          GOBIN="$RUNNER_TEMP/tools" go install github.com/akavel/rsrc@v0.10.2
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: release.sh makes no publish call
        run: scripts/test-release-build-only.sh --plain

  release-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - id: build
        uses: ./.github/actions/release-build
        with:
          version: 0.0.0-ci.${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: supcua-v2-${{ github.sha }}
          path: |
            supcua-v2.exe
            supcua-v2.exe.sha256
          if-no-files-found: error

  app-selftest:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.0"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install garble and rsrc (job-local GOBIN)
        run: |
          set -euo pipefail
          export GOBIN="$RUNNER_TEMP/selftest-tools"
          go install mvdan.cc/garble@v0.15.0
          go install github.com/akavel/rsrc@v0.10.2
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Build plain and garble exes
        run: |
          set -euo pipefail
          scripts/build.sh --plain --version 0.0.0-selftest --out out/plain
          scripts/build.sh --version 0.0.0-selftest --out out/garble
      - name: Self-tests (plain + garble, both modes)
        shell: pwsh
        run: |
          $fail = 0
          $results = Join-Path $PWD "out/results"
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          foreach ($v in "plain","garble") {
            foreach ($mode in "-selftest","-selftest-noruntime") {
              $name = $mode.TrimStart('-')
              $exe = Join-Path $PWD "out/$v/supcua-v2.exe"
              $o = "out/$v/stdout$mode.txt"; $e = "out/$v/stderr$mode.txt"
              $p = Start-Process -FilePath $exe -ArgumentList $mode -PassThru `
                   -RedirectStandardOutput $o -RedirectStandardError $e
              if (-not $p.WaitForExit(120000)) {
                $p.Kill($true)
                Write-Host "$v $mode TIMEOUT after 120s"
                $fail = 1
                continue
              }
              Write-Host "$v $mode exit=$($p.ExitCode)"
              Get-Content $o, $e -ErrorAction SilentlyContinue
              if ($p.ExitCode -ne 0) { $fail = 1 }
              Copy-Item $o (Join-Path $results "$v-$name.stdout.txt") -ErrorAction SilentlyContinue
              Copy-Item $e (Join-Path $results "$v-$name.stderr.txt") -ErrorAction SilentlyContinue
              $j = "out/$v/supcua-v2.exe.$name.json"
              if (Test-Path -LiteralPath $j) {
                Copy-Item -LiteralPath $j (Join-Path $results "$v-$name.json") -Force
              } else {
                Write-Host "::error::missing selftest result $j for $v $mode (exit=$($p.ExitCode))"
                $fail = 1
              }
            }
          }
          exit $fail
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: app-selftest-results
          path: out/results/
          if-no-files-found: error
