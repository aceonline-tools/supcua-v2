name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: cmd

jobs:
  test-and-build:
    name: Test and Build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run tests
        run: go test ./...

      - name: Install rsrc
        run: go install github.com/akavel/rsrc@latest

      - name: Generate syso from manifest
        run: rsrc -manifest main.manifest -o rsrc.syso

      - name: Build
        run: go build -ldflags="-H windowsgui" -o supcua-v2.exe .

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: supcua-v2-windows
          path: supcua-v2.exe

  release:
    name: Release
    runs-on: self-hosted
    needs: test-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install rsrc
        run: go install github.com/akavel/rsrc@latest

      - name: Generate syso from manifest
        run: rsrc -manifest main.manifest -o rsrc.syso

      - name: Build release binary
        run: go build -ldflags="-H windowsgui -s -w" -o supcua-v2.exe .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: supcua-v2.exe
          generate_release_notes: true
