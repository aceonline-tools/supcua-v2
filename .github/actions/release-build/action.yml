name: release-build
description: Build supcua-v2.exe exactly as release.sh does (rsrc + garble -literals, Go 1.25.0).
inputs:
  version:
    description: Version embedded via ldflags, without leading "v".
    required: true
outputs:
  sha256:
    description: SHA-256 of supcua-v2.exe
    value: ${{ steps.hash.outputs.sha256 }}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: "1.25.0"
        cache-dependency-path: go.sum
    - name: Cache release toolchain
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/release-tools
        key: release-tools-${{ runner.os }}-go1.25.0-garble0.15.0-rsrc0.10.2
    - name: Install garble and rsrc
      shell: bash
      run: |
        set -euo pipefail
        export GOBIN="$RUNNER_TEMP/release-tools"
        [ -x "$GOBIN/garble.exe" ] || go install mvdan.cc/garble@v0.15.0
        [ -x "$GOBIN/rsrc.exe" ] || go install github.com/akavel/rsrc@v0.10.2
        echo "$GOBIN" >> "$GITHUB_PATH"
    - name: Build supcua-v2.exe
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        GOGARBLE: github.com/yanmad27/supcua-v2
      run: |
        set -euo pipefail
        rsrc -ico app.ico -manifest main.manifest -o rsrc.syso
        garble -literals build -trimpath -ldflags="-H windowsgui -s -w -X github.com/yanmad27/supcua-v2/version.Version=$VERSION" -o supcua-v2.exe .
    - name: Hash
      id: hash
      shell: bash
      run: |
        set -euo pipefail
        sha256sum supcua-v2.exe | tee supcua-v2.exe.sha256
        echo "sha256=$(cut -d' ' -f1 supcua-v2.exe.sha256)" >> "$GITHUB_OUTPUT"
