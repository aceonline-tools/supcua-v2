name: release-build
description: Build supcua-v2.exe exactly as release.sh does (frontend + rsrc + garble -literals, Go 1.25.0) via scripts/build.sh.
inputs:
  version:
    description: Version embedded via ldflags, without leading "v".
    required: true
outputs:
  sha256:
    description: SHA-256 of supcua-v2.exe
    value: ${{ steps.hash.outputs.sha256 }}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: "1.25.0"
        cache-dependency-path: go.sum
    - uses: actions/setup-node@v4
      with:
        node-version: "26"
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Cache release toolchain
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/release-tools
        key: release-tools-${{ runner.os }}-go1.25.0-garble0.15.0-rsrc0.10.2
    - name: Install garble and rsrc
      shell: bash
      run: |
        set -euo pipefail
        export GOBIN="$RUNNER_TEMP/release-tools"
        [ -x "$GOBIN/garble.exe" ] || go install mvdan.cc/garble@v0.15.0
        [ -x "$GOBIN/rsrc.exe" ] || go install github.com/akavel/rsrc@v0.10.2
        echo "$GOBIN" >> "$GITHUB_PATH"
    - name: Build supcua-v2.exe (frontend, rsrc, garble -literals)
      shell: bash
      run: bash scripts/build.sh --version "$VERSION"
      env:
        VERSION: ${{ inputs.version }}
    - name: Hash
      id: hash
      shell: bash
      run: |
        set -euo pipefail
        sha256sum supcua-v2.exe | tee supcua-v2.exe.sha256
        echo "sha256=$(cut -d' ' -f1 supcua-v2.exe.sha256)" >> "$GITHUB_OUTPUT"
