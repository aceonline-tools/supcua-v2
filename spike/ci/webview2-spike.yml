# Place at .github/workflows/webview2-spike.yml on a spike branch. Build + self-test only:
# no tagging, no release, no upload except workflow artifacts.
name: webview2-spike
on:
  workflow_dispatch:
  push:
    branches: ["spike/**"]

jobs:
  spike:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: spike
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: spike/go.sum
      - name: Install garble and rsrc (job-local GOBIN)
        run: |
          set -euo pipefail
          export GOBIN="$RUNNER_TEMP/spike-tools"
          go install mvdan.cc/garble@v0.15.0
          go install github.com/akavel/rsrc@v0.10.2
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Build plain and garble exes
        env:
          CGO_ENABLED: "0"
          GOGARBLE: spike
        run: |
          set -euo pipefail
          rsrc -ico ../app.ico -manifest spike.manifest -o rsrc.syso
          mkdir -p out/plain out/garble
          go build -trimpath -ldflags "-H windowsgui -s -w" -o out/plain/spike.exe .
          garble -literals build -trimpath -ldflags "-H windowsgui -s -w" -o out/garble/spike.exe .
          ls -l out/plain/spike.exe out/garble/spike.exe
      - name: Self-tests (plain + garble)
        shell: pwsh
        run: |
          $fail = 0
          foreach ($v in "plain","garble") {
            foreach ($mode in "-selftest","-selftest-noruntime") {
              $exe = Join-Path $PWD "out/$v/spike.exe"
              $p = Start-Process -FilePath $exe -ArgumentList $mode,"-label",$v -Wait -PassThru `
                   -RedirectStandardOutput "out/$v/stdout$mode.txt" -RedirectStandardError "out/$v/stderr$mode.txt"
              Write-Host "$v $mode exit=$($p.ExitCode)"
              Get-Content "out/$v/stdout$mode.txt" -ErrorAction SilentlyContinue
              if ($p.ExitCode -ne 0) { $fail = 1 }
            }
          }
          exit $fail
      - name: Collect results
        if: always()
        run: |
          mkdir -p results
          for f in out/plain/*.json; do cp "$f" "results/plain-$(basename "$f")" 2>/dev/null || true; done
          for f in out/garble/*.json; do cp "$f" "results/garble-$(basename "$f")" 2>/dev/null || true; done
          cp out/*/spike.log results/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webview2-spike-results
          path: |
            spike/results/*.json
            spike/out/*/stdout*.txt
            spike/out/*/spike.log
          if-no-files-found: warn
